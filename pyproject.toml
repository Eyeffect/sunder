[project]
name = "sunder"
version = "0.3.6"
description = "Procedural duel card game — the Sundered spectrum"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sunder*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["sunder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
