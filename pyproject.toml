[project]
name = "sunder"
version = "0.3.7.5"
description = "Procedural duel card game — the Sundered spectrum"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.143.3",
    "uvicorn[standard]>=0.54.0",
    "httpx>=0.28.1",
]

[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sunder*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["sunder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
