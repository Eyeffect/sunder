<?xml version="1.0" encoding="UTF-8"?>
<!-- SUNDER card-back art — sleeve "default".
     Paint ONLY with these palette swatches (they are remapped at runtime):
       ink   #ffb545  -> var(--sleeve-ink)
       glow  #5ff2e0  -> var(--sleeve-glow)
       paper #030304  -> var(--sleeve-paper)
     Keep the 90x120 viewBox. Save as Plain SVG. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 90 120">
<g>
<rect x="0" y="0" width="90" height="120" fill="#030304">
</rect>
<defs>
<linearGradient id="wl" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#ffb545" stop-opacity="0.07">
</stop>
<stop offset="0.85" stop-color="#ffb545" stop-opacity="0">
</stop>
</linearGradient>
</defs>
<rect width="90" height="120" fill="url(#wl)">
</rect>
<circle cx="45" cy="64" r="10" fill="none" stroke="#ffb545" stroke-width="1.6" opacity="0.26">
</circle>
<circle cx="45" cy="64" r="19" fill="none" stroke="#ffb545" stroke-width="0.8" opacity="0.23">
</circle>
<circle cx="45" cy="64" r="28" fill="none" stroke="#ffb545" stroke-width="1.6" opacity="0.2">
</circle>
<circle cx="45" cy="64" r="37" fill="none" stroke="#ffb545" stroke-width="0.8" opacity="0.17">
</circle>
<circle cx="45" cy="64" r="46" fill="none" stroke="#ffb545" stroke-width="1.6" opacity="0.14">
</circle>
<line x1="8" y1="64" x2="82" y2="64" stroke="#ffb545" stroke-width="0.7" opacity="0.22" stroke-dasharray="3 5">
</line>
<circle cx="16" cy="14" r="2.4" fill="#5ff2e0" opacity="0.8">
</circle>
<text x="22" y="18" font-family="var(--font-mono)" font-size="6" fill="#ffb545" opacity="0.5">101.3 FM</text>
</g>
</svg>
