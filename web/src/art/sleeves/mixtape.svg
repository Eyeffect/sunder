</stop>
</radialGradient>
</defs>
<rect width="90" height="120" fill="url(#mt)">
</rect>
<rect x="13" y="38" width="64" height="46" fill="none" stroke="#ffb545" stroke-width="1.6" opacity="0.55">
</rect>
<rect x="17" y="42" width="56" height="13" fill="#ffb545" opacity="0.14">
</rect>
